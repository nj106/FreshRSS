# FreshRSS deployment for Portainer (nj106 fork).
# - host port 8081 -> container 80
# - volume name pinned to freshrss_data via `name:` (no compose project prefix)
# - attached to the shared `rsshub-net` network (external) so FreshRSS can
#   reach RSSHub at http://rsshub:1200 via Docker's embedded DNS.
#   (Exception to the bridge-only rule: this host's firewall rejects TCP from
#   bridge containers to the host itself, so the extra_hosts/host-gateway
#   trick cannot work here.)
# - INTERNAL_HOST_ALLOWLIST=rsshub:1200 : FreshRSS has built-in SSRF protection
#   that refuses to fetch URLs resolving to private IPs ("URL is not allowed to
#   be resolved"). This allowlist permits exactly rsshub:1200; everything else
#   stays protected.
services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
    environment:
      TZ: "Asia/Shanghai"
      INTERNAL_HOST_ALLOWLIST: "rsshub:1200"
    networks:
      - rsshub-net

volumes:
  freshrss-data:
    driver: local
    name: freshrss_data

networks:
  rsshub-net:
    external: true
